name: Render Keep-Alive

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          URL="https://luxpower-solar-dashboard.onrender.com/"
          echo "Pinging $URL ..."
          RESPONSE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || true)
          echo "HTTP status: $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Render is awake"
          else
            echo "⚠️ Render returned $RESPONSE, retrying..."
            sleep 5
            RESPONSE2=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || true)
            echo "Retry HTTP status: $RESPONSE2"
            if [ "$RESPONSE2" = "200" ]; then
              echo "✅ Render awake on retry"
            else
              echo "🔴 Render still down"
            fi
          fi
